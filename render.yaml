services:
  # 1. FastAPI Backend Service
  - type: web
    name: manuscript-buddy-backend
    env: python
    rootDir: backend
    buildCommand: pip install psycopg2-binary "psycopg[binary]" bcrypt -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard to your Supabase PostgreSQL URL
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: MSG91_DEV_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"

  # 2. React Frontend Static Site
  - type: static
    name: manuscript-buddy-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: manuscript-buddy-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
