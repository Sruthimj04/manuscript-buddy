services:
  - type: web
    name: book-submission-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: book-submission-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: MSG91_DEV_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: book-submission-db
    databaseName: book_submission
    user: book_user
